version: '3.8'

services:
  shophub-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shophub-ecommerce
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env.local
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/faqs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
